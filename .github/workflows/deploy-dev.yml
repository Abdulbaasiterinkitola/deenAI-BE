name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    
    - run: npm ci
    - run: npm run build
    
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /home/ottoman/deenai-backend-dev
          
          # Stash any local changes
          git stash
          
          # Pull latest changes
          git pull origin dev
          
          # Only install if package.json changed
          if git diff --name-only HEAD~1 HEAD | grep -q "package.json"; then
            echo "Installing dependencies..."
            npm ci --only=production
          else
            echo "No package.json changes, skipping npm install"
          fi
          
          # Build application
          npm run build
          
          # Run migrations if needed
          npm run migration:run || echo "Migration failed or not needed"
          
          # Restart application
          pm2 restart deenai-backend || pm2 start dist/main.js --name deenai-backend