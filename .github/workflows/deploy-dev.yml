name: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: hng-13-runner
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - run: npm install
    - run: npm run build
    
    - name: Copy essential files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "dist,package.json"
        target: "/home/ottoman/deenai-backend-dev/"
        overwrite: true
        
    - name: Deploy and restart
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /home/ottoman/deenai-backend-dev
          
          # Stash any local changes
          git stash
          
          # Pull latest changes
          git pull origin dev
          
          # Only install production dependencies if package.json changed
          if git diff --name-only HEAD~1 HEAD | grep -q "package.json"; then
            echo "Installing production dependencies..."
            npm install --only=production
          fi
          
          # Run migrations if needed
          npm run migration:run || echo "Migration failed or not needed"
          
          # Restart application
          pm2 restart deenai-backend || pm2 start dist/main.js --name deenai-backend
