name: Backend CI

on:
  push:
    branches:
      - staging
      - main
      - dev
      - prod
      
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches:
      - dev
    
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  ci-complete:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          result="${{ needs.lint.result }}"
          if [[ "$result" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          
          result="${{ needs.test.result }}"
          if [[ "$result" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          
          result="${{ needs.build.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "Build failed"
            exit 1
          fi
          
          echo "CI checks successful!"
